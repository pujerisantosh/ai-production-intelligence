
services:
  kafka:
    image: apache/kafka:4.2.2
    container_name: ai-production-kafka
    ports:
      - "9092:9092"

  postgres:
    image: postgres:16
    container_name: ai-production-postgres
    environment:
      POSTGRES_DB: ai_production_intelligence
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_production_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
